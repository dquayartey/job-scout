name: Bootstrap Terraform State (run once)

# Manual trigger only — this is a one-time setup job, not part of the
# regular deploy pipeline. Run it from the Actions tab: select this
# workflow, click "Run workflow".
on:
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Create state bucket and lock table (idempotent)
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          STATE_BUCKET="job-scout-terraform-state-${ACCOUNT_ID}"
          LOCK_TABLE="job-scout-terraform-locks"

          if aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            echo "Bucket already exists, skipping."
          else
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "$AWS_REGION"
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            echo "Created bucket."
          fi

          if aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Lock table already exists, skipping."
          else
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --region "$AWS_REGION" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$LOCK_TABLE" --region "$AWS_REGION"
            echo "Created lock table."
          fi

      - name: Terraform Init (connects to new backend)
        run: terraform init -input=false

      - name: Import existing resources (skips any already in state)
        run: |
          import_if_needed() {
            local addr="$1"
            local id="$2"
            if terraform state show "$addr" >/dev/null 2>&1; then
              echo "✓ $addr already in state, skipping."
            else
              echo "Importing $addr ..."
              if terraform import -input=false \
                -var="image_tag=bootstrap-placeholder" \
                -var="gemini_api_key=${{ secrets.GEMINI_API_KEY }}" \
                -var="adzuna_app_id=${{ secrets.ADZUNA_APP_ID }}" \
                -var="adzuna_app_key=${{ secrets.ADZUNA_APP_KEY }}" \
                -var="ses_sender=${{ secrets.SES_SENDER }}" \
                -var="ses_recipient=${{ secrets.SES_RECIPIENT }}" \
                "$addr" "$id"; then
                echo "✓ Imported $addr"
              else
                echo "✗ FAILED to import $addr (may not exist in AWS, or a real error — check the log above)"
              fi
            fi
          }

          import_if_needed aws_ecr_repository.job_scout job-scout
          import_if_needed aws_dynamodb_table.seen_jobs job-scout-seen-jobs
          import_if_needed aws_s3_bucket.job_scout job-scout-677276098035
          import_if_needed aws_iam_role.lambda_exec job-scout-lambda-exec
          import_if_needed aws_lambda_function.job_scout job-scout-auto

      - name: Show what's left to reconcile
        run: |
          terraform plan \
            -var="image_tag=bootstrap-placeholder" \
            -var="gemini_api_key=${{ secrets.GEMINI_API_KEY }}" \
            -var="adzuna_app_id=${{ secrets.ADZUNA_APP_ID }}" \
            -var="adzuna_app_key=${{ secrets.ADZUNA_APP_KEY }}" \
            -var="ses_sender=${{ secrets.SES_SENDER }}" \
            -var="ses_recipient=${{ secrets.SES_RECIPIENT }}" \
            -no-color | tee plan-output.txt
          echo
          echo "### If this plan wants to CREATE anything you know already exists in AWS,"
          echo "### tell me its resource address and AWS name — I'll add it to the import list."