name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: job-scout
  # Guarantees Terraform never blocks on an interactive prompt in CI —
  # any missing input becomes an immediate error instead of a silent hang.
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

permissions:
  id-token: write
  contents: read

# Prevents two runs (e.g. two quick pushes to main) from racing against the
# same AWS resources / local state at once. Queues the newer run instead of
# cancelling the older one mid-apply, since killing an in-progress apply can
# leave infrastructure half-changed.
concurrency:
  group: terraform-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      # Idempotent: creates the state bucket/lock table only if they don't
      # already exist. On every normal run (state already there) this is a
      # couple of no-op AWS API calls, a few seconds total. This means a
      # fresh clone against a brand-new AWS account "just works" with no
      # separate setup step — and if the backend ever got deleted, this
      # self-heals instead of every subsequent run failing at init.
      - name: Ensure Terraform state backend exists
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          STATE_BUCKET="job-scout-terraform-state-${ACCOUNT_ID}"
          LOCK_TABLE="job-scout-terraform-locks"

          if ! aws s3api head-bucket --bucket "$STATE_BUCKET" 2>/dev/null; then
            aws s3api create-bucket --bucket "$STATE_BUCKET" --region "${{ env.AWS_REGION }}"
            aws s3api put-bucket-versioning --bucket "$STATE_BUCKET" \
              --versioning-configuration Status=Enabled
            aws s3api put-bucket-encryption --bucket "$STATE_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
            aws s3api put-public-access-block --bucket "$STATE_BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --region "${{ env.AWS_REGION }}" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$LOCK_TABLE" --region "${{ env.AWS_REGION }}"
          fi

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Apply - ECR only (bootstrap)
        run: |
          terraform apply -auto-approve -input=false \
            -target=aws_ecr_repository.job_scout \
            -var="groq_api_key=${{ secrets.GROQ_API_KEY }}" \
            -var="adzuna_app_id=${{ secrets.ADZUNA_APP_ID }}" \
            -var="adzuna_app_key=${{ secrets.ADZUNA_APP_KEY }}" \
            -var="ses_sender=${{ secrets.SES_SENDER }}" \
            -var="ses_recipient=${{ secrets.SES_RECIPIENT }}"

      - name: Get ECR repository URL
        id: ecr
        run: echo "url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          docker build -t ${{ steps.ecr.outputs.url }}:${{ steps.meta.outputs.image_tag }} ..
          docker push ${{ steps.ecr.outputs.url }}:${{ steps.meta.outputs.image_tag }}

      - name: Terraform Apply - full
        run: |
          terraform apply -auto-approve -input=false \
            -var="image_tag=${{ steps.meta.outputs.image_tag }}" \
            -var="groq_api_key=${{ secrets.GROQ_API_KEY }}" \
            -var="adzuna_app_id=${{ secrets.ADZUNA_APP_ID }}" \
            -var="adzuna_app_key=${{ secrets.ADZUNA_APP_KEY }}" \
            -var="ses_sender=${{ secrets.SES_SENDER }}" \
            -var="ses_recipient=${{ secrets.SES_RECIPIENT }}"