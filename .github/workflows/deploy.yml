name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: job-scout

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply - ECR only (bootstrap)
        run: |
          terraform apply -auto-approve \
            -target=aws_ecr_repository.job_scout \
            -var="gemini_api_key=${{ secrets.GEMINI_API_KEY }}" \
            -var="adzuna_app_id=${{ secrets.ADZUNA_APP_ID }}" \
            -var="adzuna_app_key=${{ secrets.ADZUNA_APP_KEY }}" \
            -var="ses_sender=${{ secrets.SES_SENDER }}" \
            -var="ses_recipient=${{ secrets.SES_RECIPIENT }}"

      - name: Get ECR repository URL
        id: ecr
        run: echo "url=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        run: |
          docker build -t ${{ steps.ecr.outputs.url }}:${{ steps.meta.outputs.image_tag }} ..
          docker push ${{ steps.ecr.outputs.url }}:${{ steps.meta.outputs.image_tag }}

      - name: Terraform Apply - full
        run: |
          terraform apply -auto-approve \
            -var="image_tag=${{ steps.meta.outputs.image_tag }}" \
            -var="gemini_api_key=${{ secrets.GEMINI_API_KEY }}" \
            -var="adzuna_app_id=${{ secrets.ADZUNA_APP_ID }}" \
            -var="adzuna_app_key=${{ secrets.ADZUNA_APP_KEY }}" \
            -var="ses_sender=${{ secrets.SES_SENDER }}" \
            -var="ses_recipient=${{ secrets.SES_RECIPIENT }}"